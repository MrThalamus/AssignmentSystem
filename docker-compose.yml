# =============================================================================
#  Runs the whole system: PostgreSQL, the ASP.NET Core API, and the Next.js UI.
#
#    cp .env.example .env      # then edit the passwords and the JWT key
#    docker compose up --build
#
#    UI       http://localhost:3000
#    Swagger  http://localhost:5080/swagger
#
#  The API applies its EF Core migrations and inserts the demo data on startup,
#  so there is nothing to run by hand.
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: assignment-system-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_system}
      POSTGRES_USER: ${POSTGRES_USER:-assignment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, otherwise its first migration attempt races the
      # database's own initialisation and the container exits.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assignment_user} -d ${POSTGRES_DB:-assignment_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assignment-system-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_system};Username=${POSTGRES_USER:-assignment_user};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${Jwt__Key:?set Jwt__Key in .env}
      Jwt__Issuer: ${Jwt__Issuer:-AssignmentSystem}
      Jwt__Audience: ${Jwt__Audience:-AssignmentSystemClient}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-480}
      Database__AutoMigrate: ${Database__AutoMigrate:-true}
      Seed__Enabled: ${Seed__Enabled:-true}
      Seed__AdminPassword: ${Seed__AdminPassword:-Admin@123}
      Seed__TeacherPassword: ${Seed__TeacherPassword:-Teacher@123}
      Seed__StudentPassword: ${Seed__StudentPassword:-Student@123}
      # The browser calls the API from the host, so CORS has to name the host URL.
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so this has to be an
        # address the browser can reach - never the `api` service name.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}
    container_name: assignment-system-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
